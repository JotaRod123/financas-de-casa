*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--accent)}.app{display:flex;min-height:100vh}.sidebar{width:244px;position:sticky;top:0;height:100vh;padding:28px 17px;border-right:1px solid var(--line);background:#101c1f}.brand{font-size:20px;font-weight:750;letter-spacing:-.6px;margin:0 12px 38px}.brand span{color:var(--accent)}.nav{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;margin:3px 0;color:var(--muted);background:none;border:0;border-radius:10px;text-align:left}.nav.active{background:#1e3435;color:var(--accent)}.nav:hover{color:white}.footer{position:absolute;bottom:25px;left:23px;color:var(--muted);font-size:12px}.main{flex:1;max-width:1460px;padding:34px 44px;margin:auto;min-width:0;width:100%}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;gap:12px}h1{font-size:28px;font-weight:650;letter-spacing:-.9px;margin:0}h2{font-size:17px;font-weight:600;margin:0 0 15px}p{color:var(--muted)}.muted{color:var(--muted)}.tag{font-size:12px;color:var(--accent);background:#1f3b37;padding:6px 10px;border-radius:100px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:28px}.card,.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel)}.card{padding:21px;min-height:120px}.card small{display:block;color:var(--muted);margin-bottom:16px}.money{font-size:25px;font-weight:680;letter-spacing:-.8px}.negative{color:var(--danger)}.positive{color:var(--accent)}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.panel{padding:22px;margin-bottom:17px}.btn{border:1px solid var(--line);background:#233739;color:var(--ink);padding:10px 15px;border-radius:9px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#112521;font-weight:700}.btn.danger{color:var(--danger)}.btn.sm{padding:6px 9px;font-size:12px}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-weight:500;color:var(--muted);font-size:12px}th,td{padding:13px 9px;border-bottom:1px solid #26393b}tr:last-child td{border-bottom:0}.status{font-size:12px;border-radius:20px;padding:5px 9px;background:#263737}.status.ok{background:#214138;color:#a3e4c8}.empty{padding:36px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}label{display:flex;flex-direction:column;gap:7px;color:var(--muted);font-size:12px}input,select,textarea{min-width:0;width:100%;padding:11px 12px;background:#0c191b;border:1px solid #375053;color:var(--ink);border-radius:9px;outline:none}input:focus,select:focus{border-color:var(--accent)}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.open{display:flex}.dialog{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);padding:26px;border-radius:17px}.dialog header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.auth{max-width:420px;margin:10vh auto;padding:30px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.auth h1{margin-bottom:8px}.notice{border:1px solid #5b6345;border-radius:9px;padding:12px;background:#2b3024;color:#e9dda9;margin:14px 0}.subtitle{color:var(--muted);margin-top:6px}.menu{display:none}.stack{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.progress{height:7px;border-radius:12px;background:#304346;overflow:hidden}.progress>div{height:100%;background:var(--accent)}.pill{padding:5px 10px;background:#203639;border-radius:20px;color:var(--muted)}@media(max-width:1080px){.cards{grid-template-columns:repeat(2,1fr)}.main{padding:26px}}@media(max-width:720px){.app{display:block}.sidebar{position:static;width:100%;height:auto;padding:16px;border-right:0;border-bottom:1px solid var(--line)}.brand{margin:0 0 10px}.sidebar nav{display:flex;overflow-x:auto;gap:5px}.nav{white-space:nowrap;width:auto;padding:10px;font-size:12px}.footer{display:none}.main{padding:22px 15px}.grid2{grid-template-columns:1fr}.cards{gap:9px}.card{padding:14px;min-height:104px}.money{font-size:19px}h1{font-size:24px}.formgrid{grid-template-columns:1fr}} 
</style></head><body><div id="root"></div><div class="modal" id="modal"><div class="dialog"><header><h2 id="modalTitle"></h2><button class="btn sm" onclick="closeModal()">Fechar</button></header><form id="modalForm" class="formgrid"></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
const sb=window.supabase.createClient('https://uynetqarcaldgjvwvelr.supabase.co','sb_publishable_lg7xZoC6CQB-xEn5NfbhPw_B5-8Cn0L');
const nav=['Visão Geral','Movimentações','Cartões','Planejamento','Gastos Fixos','Investimentos','Metas'];
const icons=['⌂','↔','▣','▤','↻','◈','◎'];let page=0,user=null,home=null,rows={},editing=null;
const el=x=>document.getElementById(x),fmt=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0),date=()=>new Date().toISOString().slice(0,10),month=()=>date().slice(0,7),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),eattr=esc;
const root=el('root');const money=(n)=>'<span class="'+(n<0?'negative':'')+'">'+fmt(n)+'</span>';
function msg(m){alert(m)}
function authUI(){root.innerHTML='<div class="auth"><div class="brand">Casa <span>Finanças</span></div><h1>Entrar no Casa Finanças</h1><p>Acesso privado para José e Bianca.</p><form id="authForm" class="formgrid"><label class="full">E-mail<input type="email" name="email" required autocomplete="email" value="jotabia@dash.com" readonly></label><label class="full">Senha<input type="password" name="password" required minlength="6" autocomplete="current-password" placeholder="Sua senha"></label><div class="full actions"><button type="submit" class="btn primary" id="loginButton">Entrar</button></div></form><div class="subtitle" id="authStatus" role="status"></div></div>';el('authForm').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target),email=String(d.get('email')),password=String(d.get('password')),status=el('authStatus'),button=el('loginButton');button.disabled=true;status.textContent='Verificando acesso...';try{let {error}=await sb.auth.signInWithPassword({email,password});if(!error){await start();return}if(error.message?.toLowerCase().includes('invalid login credentials')){const signup=await sb.auth.signUp({email,password});if(signup.error){status.textContent='Não foi possível ativar o acesso: '+signup.error.message;return}if(signup.data.session){status.textContent='Acesso ativado.';await start();return}status.textContent='Primeiro acesso solicitado. Confirme o e-mail enviado para '+email+' e depois clique em Entrar novamente. Se não receber, verifique se essa caixa postal existe.';return}status.textContent='Não foi possível entrar: '+error.message}catch(err){status.textContent='Erro de conexão: '+err.message}finally{button.disabled=false}}}
async function start(){const {data}=await sb.auth.getUser();user=data.user;if(!user)return authUI();let {data:owned,error}=await sb.from('households').select('*').limit(1);if(error)return root.innerHTML='<div class="auth">Erro ao buscar sua família: '+esc(error.message)+'</div>';if(!owned?.length)return setup();home=owned[0];await load();render()}
function setup(){root.innerHTML='<div class="auth"><div class="brand">Casa <span>Finanças</span></div><h1>Configurar sua casa</h1><p>Crie seu ambiente familiar ou entre no ambiente de alguém que te convidou.</p><div class="actions"><button class="btn primary" id="createHouse">Criar minha casa</button><button class="btn" id="joinHouse">Aceitar convite</button><button class="btn" id="leave">Sair</button></div><p id="setupStatus"></p></div>';el('createHouse').onclick=async()=>{let {data,error}=await sb.from('households').insert({owner_id:user.id,name:'Casa Finanças'}).select().single();if(error)return msg(error.message);home=data;await load();render()};el('joinHouse').onclick=async()=>{const email=user.email?.toLowerCase();const {data:inv,error}=await sb.from('household_invites').select('household_id').eq('email',email).limit(1);if(error)return msg(error.message);if(!inv?.length)return msg('Não existe convite para este e-mail. Peça ao responsável para convidar você.');const r=await sb.from('household_members').insert({household_id:inv[0].household_id,user_id:user.id,display_name:email});if(r.error)return msg(r.error.message);await start()};el('leave').onclick=()=>sb.auth.signOut().then(authUI)}
async function load(){const names=['transactions','fixed_expenses','cards','budgets','investments','goals','household_invites'];for(const n of names){const {data,error}=await sb.from(n).select('*').eq('household_id',home.id).order('created_at',{ascending:false});rows[n]=data||[];if(error)console.warn(n,error.message)}await recurrence()}
async function recurrence(){const today=new Date(),ym=month();for(const r of rows.fixed_expenses){if(!r.active||r.starts_on.slice(0,7)>ym||(r.ends_on&&r.ends_on.slice(0,7)<ym))continue;const day=Math.min(r.due_day,new Date(today.getFullYear(),today.getMonth()+1,0).getDate());const dt=ym+'-'+String(day).padStart(2,'0');if(rows.transactions.some(t=>t.recurrence_id===r.id&&t.date.slice(0,7)===ym))continue;const {error}=await sb.from('transactions').insert({household_id:home.id,recurrence_id:r.id,title:r.title,amount:r.amount,date:dt,kind:'expense',status:'pending',category:r.category,payer:r.payer,destination:r.destination});if(error&&error.code!=='23505')console.warn(error.message)}const {data}=await sb.from('transactions').select('*').eq('household_id',home.id).order('date',{ascending:false});if(data)rows.transactions=data}
const field=(name,label,type='text',options=null,val='')=>'<label>'+label+(options?'<select name="'+name+'">'+options.map(x=>{let [v,t]=Array.isArray(x)?x:[x,x];return '<option value="'+esc(v)+'" '+(String(val)===String(v)?'selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select>':'<input name="'+name+'" type="'+type+'" value="'+eattr(val)+'" '+(type==='number'?'step="any" min="0"':'')+' required>')+'</label>';
const people=['José','Bianca','Ambos'],dest=['Casa','José','Bianca'],cats=['Moradia','Alimentação','Transporte','Saúde','Lazer','Educação','Compras','Outros'];
const forms={
transactions:r=>field('title','Descrição','text',null,r.title)+field('amount','Valor (R$)','number',null,r.amount)+field('kind','Tipo','text',[['expense','Despesa'],['income','Receita'],['transfer','Transferência']],r.kind||'expense')+field('date','Data','date',null,r.date||date())+field('category','Categoria','text',cats,r.category||'Outros')+field('status','Situação','text',[['pending','Pendente'],['settled','Efetivado']],r.status||'pending')+field('payer','Quem pagou / recebeu','text',people,r.payer||'Ambos')+field('destination','Destino','text',dest,r.destination||'Casa')+'<label>Cartão<select name="card_id"><option value="">Nenhum</option>'+rows.cards.map(c=>'<option value="'+c.id+'" '+(r.card_id===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></label>',
fixed_expenses:r=>field('title','Descrição','text',null,r.title)+field('amount','Valor mensal (R$)','number',null,r.amount)+field('due_day','Dia de vencimento','number',null,r.due_day||10)+field('category','Categoria','text',cats,r.category||'Moradia')+field('payer','Responsável','text',people,r.payer||'Ambos')+field('destination','Destino','text',dest,r.destination||'Casa')+field('starts_on','Início','date',null,r.starts_on||date())+field('active','Ativo','text',[['true','Sim'],['false','Não']],String(r.active??true)),
cards:r=>field('name','Nome do cartão','text',null,r.name)+field('holder','Titular','text',['José','Bianca'],r.holder||'José')+field('last_four','Últimos 4 dígitos','text',null,r.last_four||'0000')+field('closing_day','Fechamento (dia)','number',null,r.closing_day||1)+field('due_day','Vencimento (dia)','number',null,r.due_day||10),
budgets:r=>field('category','Categoria','text',cats,r.category||'Alimentação')+field('month','Mês (primeiro dia)','date',null,r.month||month()+'-01')+field('limit_amount','Limite mensal (R$)','number',null,r.limit_amount),
investments:r=>field('owner','Titular','text',people,r.owner||'José')+field('brokerage','Corretora','text',null,r.brokerage||'XP')+field('symbol','Ativo / código','text',null,r.symbol)+field('asset_type','Classe','text',['Ação','ETF','FII','Renda fixa','Cripto','Outros'],r.asset_type||'Ação')+field('currency','Moeda','text',['BRL','USD'],r.currency||'BRL')+field('quantity','Quantidade','number',null,r.quantity)+field('average_cost','Custo médio (por unidade)','number',null,r.average_cost)+field('current_price','Preço atual manual','number',null,r.current_price)+field('usd_brl','Câmbio USD/BRL manual (use 1 para BRL)','number',null,r.usd_brl||1),
goals:r=>field('title','Nome da meta','text',null,r.title)+field('target_amount','Objetivo (R$)','number',null,r.target_amount)+field('current_amount','Já reservado (R$)','number',null,r.current_amount||0)+field('due_date','Data alvo','date',null,r.due_date||date())
};
function openModal(kind,id){editing={kind,id};const r=rows[kind].find(x=>x.id===id)||{};el('modalTitle').textContent=(id?'Editar ':'Adicionar ')+({transactions:'movimentação',fixed_expenses:'gasto fixo',cards:'cartão',budgets:'planejamento',investments:'investimento',goals:'meta'}[kind]);el('modalForm').innerHTML=forms[kind](r)+'<div class="full actions"><button class="btn primary" type="submit">Salvar</button><button type="button" class="btn" onclick="closeModal()">Cancelar</button></div>';el('modal').classList.add('open')}
function closeModal(){el('modal').classList.remove('open')}
el('modalForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target).entries()),{kind,id}=editing;for(const k in f)if(f[k]==='')f[k]=null;if('active'in f)f.active=f.active==='true';if('month'in f)f.month=f.month.slice(0,7)+'-01';if('card_id'in f&&!f.card_id)f.card_id=null;if(kind==='investments')f.price_updated_at=new Date().toISOString();if(kind==='transactions'&&id&&rows.transactions.find(x=>x.id===id)?.recurrence_id)delete f.recurrence_id;let q=id?sb.from(kind).update(f).eq('id',id):sb.from(kind).insert({...f,household_id:home.id});const {error}=await q;if(error)return msg(error.message);closeModal();await load();render()};
async function remove(kind,id){if(!confirm('Excluir este registro?'))return;const {error}=await sb.from(kind).delete().eq('id',id);if(error)return msg(error.message);await load();render()}
async function settle(id){const r=rows.transactions.find(x=>x.id===id),{error}=await sb.from('transactions').update({status:r.status==='settled'?'pending':'settled'}).eq('id',id);if(error)return msg(error.message);await load();render()}
const btns=(kind,r)=>'<button class="btn sm" onclick="openModal(\''+kind+'\',\''+r.id+'\')">Editar</button> <button class="btn sm danger" onclick="remove(\''+kind+'\',\''+r.id+'\')">Excluir</button>';
const tb=(head,body)=>'<div class="tablewrap"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+ (body||'<tr><td colspan="'+head.length+'" class="empty">Nenhum registro ainda.</td></tr>')+'</tbody></table></div>';
function stats(){const tx=rows.transactions||[];let settled=tx.filter(x=>x.status==='settled'),sum=(a,k)=>a.reduce((v,x)=>v+(x.kind===k?Number(x.amount):0),0);let income=sum(settled,'income'),expense=sum(settled,'expense');let allinc=sum(tx,'income'),allexp=sum(tx,'expense');return {income,expense,balance:income-expense,projected:allinc-allexp,pending:tx.filter(x=>x.status==='pending').length}}
function transTable(data){return tb(['Data','Descrição','Responsável','Destino','Tipo','Valor','Status','Ações'],data.map(t=>'<tr><td>'+esc(t.date?.split('-').reverse().join('/'))+'</td><td>'+esc(t.title)+(t.recurrence_id?' <span class="pill">Fixo</span>':'')+'</td><td>'+esc(t.payer)+'</td><td>'+esc(t.destination)+'</td><td>'+({income:'Receita',expense:'Despesa',transfer:'Transferência'}[t.kind]||t.kind)+'</td><td class="'+(t.kind==='expense'?'negative':'positive')+'">'+(t.kind==='expense'?'-':'')+fmt(t.amount)+'</td><td><button class="btn sm" onclick="settle(\''+t.id+'\')">'+(t.status==='settled'?'✓ Pago':'○ Pendente')+'</button></td><td>'+btns('transactions',t)+'</td></tr>').join(''))}
function render(){const s=stats();root.innerHTML='<div class="app"><aside class="sidebar"><div class="brand">Casa <span>Finanças</span></div><nav>'+nav.map((n,i)=>'<button class="nav '+(i===page?'active':'')+'" onclick="go('+i+')"><span>'+icons[i]+'</span>'+n+'</button>').join('')+'</nav><div class="footer">'+esc(user.email)+'<br><button class="btn sm" style="margin-top:8px" onclick="logout()">Sair</button></div></aside><main class="main"><div class="top"><div><h1>'+nav[page]+'</h1><div class="subtitle">'+esc(home.name)+' · Controle familiar</div></div><span class="tag">● Sincronizado</span></div><div id="content"></div></main></div>';let content='';
if(page===0){content='<div class="cards"><div class="card"><small>Saldo realizado</small><div class="money">'+money(s.balance)+'</div></div><div class="card"><small>Saldo projetado</small><div class="money">'+money(s.projected)+'</div></div><div class="card"><small>Recebido</small><div class="money positive">'+fmt(s.income)+'</div></div><div class="card"><small>Despesas pagas</small><div class="money">'+fmt(s.expense)+'</div></div></div><div class="grid2"><section class="panel"><h2>Últimas movimentações</h2>'+transTable(rows.transactions.slice(0,6))+'</section><section class="panel"><h2>Visão do mês</h2><p>'+s.pending+' movimentações pendentes</p><p>Gastos fixos ativos: '+rows.fixed_expenses.filter(x=>x.active).length+'</p><p>Metas cadastradas: '+rows.goals.length+'</p><button class="btn primary" onclick="openModal(\'transactions\')">+ Nova movimentação</button></section></div>'}
if(page===1){content='<section class="panel"><div class="top"><h2>Todas as movimentações</h2><button class="btn primary" onclick="openModal(\'transactions\')">+ Adicionar</button></div>'+transTable(rows.transactions)+'</section>'}
if(page===2){content='<section class="panel"><div class="top"><h2>Cartões cadastrados</h2><button class="btn primary" onclick="openModal(\'cards\')">+ Cartão</button></div>'+tb(['Cartão','Titular','Final','Fechamento','Vencimento','Ações'],rows.cards.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.holder)+'</td><td>•••• '+esc(c.last_four)+'</td><td>Dia '+c.closing_day+'</td><td>Dia '+c.due_day+'</td><td>'+btns('cards',c)+'</td></tr>').join(''))+'</section><p>Despesas associadas aos cartões aparecem nas movimentações; não são somadas novamente.</p>'}
if(page===3){const tx=rows.transactions.filter(x=>x.kind==='expense'&&x.date.slice(0,7)===month());content='<section class="panel"><div class="top"><h2>Limites por categoria</h2><button class="btn primary" onclick="openModal(\'budgets\')">+ Definir limite</button></div>'+rows.budgets.map(b=>{const used=tx.filter(t=>t.category===b.category).reduce((s,t)=>s+Number(t.amount),0),pc=Number(b.limit_amount)>0?Math.min(100,used/b.limit_amount*100):0;return '<div style="margin:17px 0"><div class="top" style="margin-bottom:8px"><strong>'+esc(b.category)+' · '+esc(b.month.slice(0,7))+'</strong><span>'+fmt(used)+' / '+fmt(b.limit_amount)+' '+btns('budgets',b)+'</span></div><div class="progress"><div style="width:'+pc+'%"></div></div></div>'}).join('')+(rows.budgets.length?'':'<div class="empty">Defina os limites do mês por categoria.</div>')+'</section>'}
if(page===4){content='<section class="panel"><div class="top"><h2>Despesas recorrentes</h2><button class="btn primary" onclick="openModal(\'fixed_expenses\')">+ Gasto fixo</button></div>'+tb(['Descrição','Valor','Vencimento','Responsável','Situação','Ações'],rows.fixed_expenses.map(r=>'<tr><td>'+esc(r.title)+'</td><td>'+fmt(r.amount)+'</td><td>Dia '+r.due_day+'</td><td>'+esc(r.payer)+'</td><td>'+ (r.active?'Ativo':'Pausado')+'</td><td>'+btns('fixed_expenses',r)+'</td></tr>').join(''))+'</section><p>Os gastos fixos ativos geram automaticamente uma movimentação pendente no mês. O sistema não duplica a mesma recorrência.</p>'}
if(page===5){let v=rows.investments.reduce((n,r)=>n+Number(r.quantity)*Number(r.current_price)*(r.currency==='USD'?Number(r.usd_brl||1):1),0);content='<div class="cards" style="grid-template-columns:repeat(2,1fr)"><div class="card"><small>Valor estimado da carteira</small><div class="money">'+fmt(v)+'</div></div><div class="card"><small>Ativos cadastrados</small><div class="money">'+rows.investments.length+'</div></div></div><section class="panel"><div class="top"><h2>Meus investimentos</h2><button class="btn primary" onclick="openModal(\'investments\')">+ Investimento</button></div>'+tb(['Ativo','Titular','Corretora','Qtd.','Preço manual','Valor estimado','Ações'],rows.investments.map(r=>'<tr><td>'+esc(r.symbol)+'</td><td>'+esc(r.owner)+'</td><td>'+esc(r.brokerage)+'</td><td>'+r.quantity+'</td><td>'+r.currency+' '+r.current_price+'</td><td>'+fmt(Number(r.quantity)*Number(r.current_price)*(r.currency==='USD'?Number(r.usd_brl||1):1))+'</td><td>'+btns('investments',r)+'</td></tr>').join(''))+'</section><p>Preços e câmbio são manuais; não há cotação em tempo real.</p>'}
if(page===6){content='<section class="panel"><div class="top"><h2>Objetivos da família</h2><button class="btn primary" onclick="openModal(\'goals\')">+ Nova meta</button></div>'+rows.goals.map(r=>'<div style="padding:15px 0;border-bottom:1px solid var(--line)"><div class="top" style="margin-bottom:9px"><strong>'+esc(r.title)+'</strong><div>'+fmt(r.current_amount)+' / '+fmt(r.target_amount)+' '+btns('goals',r)+'</div></div><div class="progress"><div style="width:'+Math.min(100,100*Number(r.current_amount)/Number(r.target_amount))+'%"></div></div></div>').join('')+(rows.goals.length?'':'<div class="empty">Crie uma meta para começar.</div>')+'</section>'}
if(page===0)content+='<section class="panel"><h2>Compartilhar com Bianca</h2><p>Convide o e-mail usado por ela no cadastro. Assim, os dois acessam as mesmas informações.</p><div class="stack"><input style="max-width:310px" id="inviteEmail" type="email" placeholder="E-mail da Bianca"><button class="btn" onclick="invite()">Autorizar e-mail</button></div><p class="muted">Após confirmar o e-mail de cadastro, ela deve escolher “Aceitar convite” na primeira entrada. Não é enviado e-mail automático.</p></section>';
el('content').innerHTML=content}
async function invite(){const email=el('inviteEmail')?.value.trim().toLowerCase();if(!email)return msg('Informe um e-mail válido.');const {error}=await sb.from('household_invites').upsert({household_id:home.id,email,invited_by:user.id},{onConflict:'household_id,email'});msg(error?error.message:'E-mail autorizado! Peça para ela criar a conta e aceitar o convite.')}
function go(n){page=n;render()}async function logout(){await sb.auth.signOut();user=null;home=null;authUI()}
sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')authUI()});start().catch(e=>root.textContent='Erro ao iniciar: '+e.message);
</script></body></html>
